[project]
name = "smart-speaker-cloud"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "httpx>=0.27",
]
[project.optional-dependencies]
ml = ["tensorflow>=2.16", "librosa>=0.10", "numpy>=1.26"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
